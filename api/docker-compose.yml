services:
    db:
        image: postgres:16
        container_name: BANCO-db-dev
        environment:
            POSTGRES_USER: dev
            POSTGRES_PASSWORD: dev123
            POSTGRES_DB: BANCO-db-dev
        ports:
            - "5432:5432"
        volumes:
            - BANCO-db-data:/var/lib/postgresql/data

volumes:
    BANCO-db-data:
